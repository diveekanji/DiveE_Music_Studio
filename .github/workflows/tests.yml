name: Tests
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python -m demucs.separate --help
